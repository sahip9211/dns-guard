name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --lib --bin dns-guard --locked
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --all-targets --locked
      - name: Set up isolated Linux native-store tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Linux native credential library
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: python3 tests/systemd/run_keyring_linux.py
      - name: Windows native credential library
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: cargo +stable test --test keyring_native --locked -- --ignored --nocapture --test-threads=1
      - name: macOS native credential library
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          security create-keychain -p synthetic-ci-only "$RUNNER_TEMP/dns-guard-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/dns-guard-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/dns-guard-ci.keychain-db"
          security unlock-keychain -p synthetic-ci-only "$RUNNER_TEMP/dns-guard-ci.keychain-db"
          cargo +stable test --test keyring_native --locked -- --ignored --nocapture --test-threads=1
      - name: Remove macOS test keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/dns-guard-ci.keychain-db"
      - run: cargo +stable check --no-default-features --locked
      - name: Headless browser dashboard
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          npm ci --prefix tests/web --ignore-scripts
          npx --prefix tests/web playwright install --with-deps chromium
          npm test --prefix tests/web
      - run: cargo +stable build --release --locked
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests/python -p 'test_*.py'
  diagnostic-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cd tools/bench/native && go test ./...
