[package]
name = "dns-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Compact, exact DNS policy engine and offline list compiler"

[features]
default = ["os-keyring"]
os-keyring = ["dep:keyring-core", "dep:hex", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store", "dep:dbus-secret-service-keyring-store"]

[dependencies]
fst = "=0.4.7"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
ipnet = "=2.11.0"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "limits", "fallible_uint"] }
getrandom = "=0.4.3"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
keyring-core = { version = "=1.0.1", optional = true }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"], optional = true }
tokio = { version = "=1.48.0", default-features = false, features = ["net", "rt", "sync", "time", "io-util", "macros", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-openssl", "vendored"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false, optional = true }

[dev-dependencies]
# Development-only event-loop benchmark adapter.
mio = { version = "=1.2.4", features = ["net", "os-poll"] }
httparse = "=1.10.1"
# Local k6 harness only; not linked into the shipped CLI/library.
tiny_http = { version = "=0.12.0", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.17", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.3"
tokio = { version = "=1.48.0", default-features = false, features = ["rt-multi-thread"] }

[profile.release]
# Measured speed/size tradeoff; see docs/implementation-status.md.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# SQL is startup/administration work. Preserve -O3 for DNS and size-optimize the
# bundled SQLite C implementation independently.
[profile.release.package.libsqlite3-sys]
opt-level = "s"

[[bin]]
name = "dns-guard"
path = "src/main.rs"
