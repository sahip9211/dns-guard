[package]
name = "dns-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Compact, exact DNS policy engine and offline list compiler"

[dependencies]
fst = "=0.4.7"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
ipnet = "=2.11.0"
tokio = { version = "=1.48.0", default-features = false, features = ["net", "rt", "sync", "time", "io-util", "macros", "signal"] }

[dev-dependencies]
# Development-only event-loop benchmark adapter.
mio = { version = "=1.2.4", features = ["net", "os-poll"] }
httparse = "=1.10.1"
# Local k6 harness only; not linked into the shipped CLI/library.
tiny_http = { version = "=0.12.0", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.17", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.3"
tokio = { version = "=1.48.0", default-features = false, features = ["rt-multi-thread"] }

[profile.release]
# Measured speed/size tradeoff; see docs/implementation-status.md.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "dns-guard"
path = "src/main.rs"
